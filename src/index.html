<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- img-src includes data: so <img src="data:image/png;base64,…"> works.
       The memorial-event photos are served as data URLs from the main
       process (memorial_events:photo_read IPC); without `data:` the CSP
       blocks them and the <img> falls back to the broken-image icon.
       `default-src 'self'` alone covers `script-src`, `style-src`,
       `connect-src`, etc.; we explicitly widen `img-src` and `style-src`
       (the inline styles used by the date picker / chips / photo grid
       require 'unsafe-inline'). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>SoulDesktopPet</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🐾 SoulDesktopPet</div>
    <nav class="nav">
      <a href="#/today" data-route="/today">今日</a>
      <a href="#/contacts" data-route="/contacts">联系人</a>
      <a href="#/likes" data-route="/likes">喜好</a>
      <a href="#/taboos" data-route="/taboos">忌讳</a>
      <a href="#/gifts" data-route="/gifts">礼物</a>
      <a href="#/reminders" data-route="/reminders">提醒日期</a>
      <a href="#/events/memorial" data-route="/events/memorial">回忆事件</a>
      <a href="#/events/work" data-route="/events/work">工作事件</a>
      <a href="#/tools" data-route="/tools">工具</a>
      <a href="#/settings" data-route="/settings">设置</a>
    </nav>
    <div class="pet-pill" id="pet-pill">
      <span class="pet-dot" id="pet-dot"></span>
      <span id="pet-pill-text">宠物正常</span>
    </div>
  </header>
  <main id="app" class="content"></main>

  <!-- Reminder modal -->
  <div class="modal-backdrop hidden" id="reminder-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="reminder-title">提醒</h3>
        <button class="icon-btn" id="reminder-close">✕</button>
      </div>
      <div class="modal-body">
        <div id="reminder-meta" class="reminder-meta"></div>
        <p id="reminder-description"></p>
        <div id="reminder-actions" class="modal-actions"></div>
      </div>
    </div>
  </div>

  <!-- PIN lock modal: shown on every main-window show.
       No close button on purpose — clicking X must not bypass auth. -->
  <div class="modal-backdrop" id="pin-modal" data-no-close="1">
    <div class="modal pin-modal">
      <div class="modal-header">
        <h3>请输入访问密码</h3>
      </div>
      <div class="modal-body">
        <div class="pin-cells" id="pin-cells" autocomplete="off">
          <input class="pin-cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="第 1 位" />
          <input class="pin-cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="第 2 位" />
          <input class="pin-cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="第 3 位" />
          <input class="pin-cell" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="第 4 位" />
        </div>
        <p class="pin-error hidden" id="pin-error">密码错误，请重试。</p>
        <div class="modal-actions">
          <button class="btn" id="pin-unlock" disabled>解锁</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
