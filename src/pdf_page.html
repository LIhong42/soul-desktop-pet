<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- The offscreen diary page. It renders ONE memory note exactly the way
       the 回忆 editor draws it — the same CSS, the same modules, the same
       block order — and the main process screenshots it for the PDF.

       The CSP matches index.html: the photos are data URLs (the same
       `memorial_events:photo_read` IPC the editor uses). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>回忆导出排版</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* The page is a measuring bench, not an app screen: no scrollbars, no
       app chrome, and a transparent background so the screenshot carries
       only the note itself. */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    body {
      display: inline-block;
      font-family: var(--font-stack);
      color: var(--text);
    }
    /* The note's own sheet. The width is set by the main process (the
       capture width) so the rendered layout is the one the PDF will show. */
    #pdf-sheet {
      display: block;
    }

    /* The note is drawn as a memory card — title bar on top, the writing
       in the middle, the date on the foot — because that is how the
       entry is shown in the list. The card keeps a FIXED height and
       clips what runs past it, which is right for a thumbnail and wrong
       for a page that has to hold the whole entry. So the height and the
       clip are lifted here, and the fade is taken away with it: the
       PDF's note is not a thumbnail of itself, it IS the page. */
    .pdf-note-sheet {
      height: auto;
      overflow: visible;
    }
    .pdf-note-body {
      flex: 0 0 auto;
      overflow: visible;
      -webkit-mask-image: none;
      mask-image: none;
    }
    /* The card's body is a thumbnail of the editor's page: it scales the
       whole page down to fit the card's width. Here the page IS the
       thing being drawn, so it is laid out at its own size. */
    .pdf-note-body .diary-blocks {
      margin-top: 0;
    }
    /* The card's header cuts a long title on one line. A page of paper
       has room for two. */
    .pdf-note-header {
      white-space: normal;
    }
  </style>
</head>
<body>
  <div id="pdf-sheet"></div>
  <script type="module" src="js/pdf_page.js"></script>
</body>
</html>
