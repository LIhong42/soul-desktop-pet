<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- pet window CSP: allow `file:` for img-src so the <img> can load
       PNG frames directly from the disk via pathToFileURL(). `style-src
       'unsafe-inline'` keeps the existing inline styles in pet.css. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>SoulDesktopPet 桌宠</title>
  <link rel="stylesheet" href="css/pet.css" />
</head>
<body>
  <div class="pet-root" id="pet-root">
    <div class="pet-sprite" id="pet-sprite" data-state="NORMAL" data-pet="" data-action="default" data-direction="right">
      <img id="pet-frame" class="pet-frame" alt="" draggable="false" />
    </div>

    <!-- Reminder badge (corner count) + speech bubble above the sprite -->
    <div class="badge hidden" id="pet-badge">0</div>
    <div class="reminder-bubble hidden" id="pet-bubble"></div>
    <!-- Cozy bond bubble (auto-generated text from pet_mood) -->
    <div class="bond-bubble hidden" id="pet-bond-bubble"></div>
    <!-- Contextual text bubble (吃饭提醒 / 休息提醒). Driven entirely
         by main/pet_bubbles.js over the `pet:bubble-changed` channel; the
         renderer only paints what it's told and auto-hides on `endsAt`.
         `data-box` names the 文本框 artwork (resources/text_boxes); when it's
         set the bubble switches from the CSS card to that image and the text
         is centred on it. -->
    <div class="pet-bubble hidden" id="pet-text-bubble" data-kind="" data-box="">
      <img class="pet-bubble-art" id="pet-bubble-art" alt="" draggable="false" />
      <span class="pet-bubble-text" id="pet-bubble-text"></span>
    </div>
    <!-- Particle layer — transient hearts / sparkles / food / etc. -->
    <div class="pet-particles" id="pet-particles" aria-hidden="true"></div>
  </div>
  <script src="js/pet.js"></script>
</body>
</html>
